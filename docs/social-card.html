<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0b1210;font-family:"Inter",sans-serif;color:#ecefed;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(52% 60% at 82% 6%,rgba(23,181,143,.34),transparent 66%)}
.dots{position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.2px);background-size:30px 30px;
  -webkit-mask-image:linear-gradient(120deg,#000,transparent 68%)}
.pad{position:absolute;inset:0;padding:66px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-family:"JetBrains Mono",monospace;font-weight:600;
  font-size:29px;letter-spacing:-.02em}
.brand .d{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#2ee0b0,#0f8c68);
  box-shadow:0 0 0 5px rgba(23,181,143,.16)}
h1{font-weight:800;font-size:74px;line-height:1.04;letter-spacing:-.035em;margin-top:auto}
h1 .g{background:linear-gradient(108deg,#2ee0b0,#12a37a 62%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.sub{font-size:27px;color:#9aa8a2;font-weight:400;margin-top:26px;max-width:20ch;letter-spacing:-.01em}
.foot{margin-top:auto;display:flex;align-items:center;gap:26px}
.term{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:500;background:#0f1a16;
  border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:15px 22px;display:flex;gap:22px;align-items:center}
.term>span{white-space:nowrap}
.term .z{color:#5dcaa5;font-weight:600}.term .a{color:#e3b341}.term .d{color:#6b7a74}
.tag{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:17px;color:#7a8a83;white-space:nowrap}
</style>
</head>
<body>
<div class="glow"></div>
<div class="dots"></div>
<div class="pad">
  <div class="brand"><span class="d"></span>tandem-tokens</div>
  <h1>Your GPU does the grunt work.<br><span class="g">Premium models do the thinking.</span></h1>
  <div class="sub">Offload bulk work to local models. Spend cloud tokens where they matter.</div>
  <div class="foot">
    <div class="term">
      <span><span class="z">ran for $0.00</span> <span class="d">local GPU</span></span>
      <span><span class="d">avoided</span> <span class="a">~$2.08</span> <span class="d">cloud map est.</span></span>
    </div>
    <span class="tag">github.com/BI-Blitzer/tandem-tokens</span>
  </div>
</div>
</body>
</html>
