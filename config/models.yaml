# ollamaq model routing table.
# Measured on RTX 5080 / 16 GB VRAM (see PLAN.md section 1).
# This file is the ONLY place model names may appear - no module hardcodes them.

ollama:
  base_url: http://localhost:11434
  timeout_s: 300
  keep_alive: 30m

defaults:
  model: qwen2.5-14b-16k
  temperature: 0.1

models:
  qwen2.5-14b-16k:
    max_parallel: 2
    num_ctx: 16384
    notes: Workhorse - cleaning, structured extraction, codegen drafts. ~9 GB, fully GPU-resident.
  hermes3-8b-32k:
    max_parallel: 4
    num_ctx: 32768
    notes: Long-context reader for bulk summarization/extraction.
  "qwen3:8b":
    max_parallel: 4
    num_ctx: 16384
    notes: Candidate generator / verifier for gen_test loops (thinking mode).
  "gemma2:9b":
    max_parallel: 4
    num_ctx: 8192
    notes: Fast classifier / labeler / triage.
  "gemma2:27b":
    max_parallel: 1
    num_ctx: 8192
    enabled: false
    notes: Spills to CPU on 16 GB - opt-in escalation tier only.
  "gemma3:4b":
    max_parallel: 2
    num_ctx: 8192
    notes: Vision (image extraction) + text. Works with this Ollama build. ~3.3 GB.
  "llama3.2-vision:11b":
    max_parallel: 1
    num_ctx: 8192
    enabled: false
    notes: Vision, but its 'mllama' arch won't load on Ollama 0.31.1 - use gemma3:4b.

# task_tag -> model. Used when a job spec says model: auto.
routing:
  clean: qwen2.5-14b-16k
  extract: qwen2.5-14b-16k
  summarize: hermes3-8b-32k
  classify: "gemma2:9b"
  generate: "qwen3:8b"
  code: qwen2.5-14b-16k
  vision: "gemma3:4b"
