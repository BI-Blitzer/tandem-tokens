[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollamaq"
version = "0.2.0"
description = "Local Ollama offload harness for premium agents (Claude, Grok, Codex, …): map-reduce jobs, queue daemon, energy scoreboard, MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "BI-Blitzer" }]
keywords = ["ollama", "llm", "mcp", "map-reduce", "batch", "offload", "local-llm", "grok", "claude", "codex", "energy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "jsonschema>=4.20",
    "mcp>=1.6",
]

[project.urls]
Homepage = "https://bi-blitzer.github.io/tandem-tokens/"
Repository = "https://github.com/BI-Blitzer/tandem-tokens"
Issues = "https://github.com/BI-Blitzer/tandem-tokens/issues"
Documentation = "https://bi-blitzer.github.io/tandem-tokens/"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "respx>=0.21",
]

[project.scripts]
ollamaq = "ollamaq.cli:app"
ollamaq-mcp = "ollamaq.mcp_server:main"
ollamaq-mcp-grok = "ollamaq.mcp_grok:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ollamaq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
timeout_method = "thread"
markers = [
    "integration: requires a live Ollama server; enable with OLLAMAQ_LIVE=1",
]
