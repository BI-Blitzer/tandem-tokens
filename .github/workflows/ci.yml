name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # The suite is fully HTTP-mocked (respx) — no Ollama or GPU needed.
    # Runs on Windows (the developed/tested platform) across supported Pythons.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: ubuntu-latest,  python-version: "3.13" }   # validate Linux portability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"   # stream results instead of block-buffering
        run: python -u -m pytest -q
