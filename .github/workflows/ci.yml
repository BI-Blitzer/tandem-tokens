name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # The suite is fully HTTP-mocked (respx) — no Ollama or GPU needed.
    # Runs on Windows (the developed/tested platform) across supported Pythons.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
