name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # The suite is fully HTTP-mocked (respx) — no Ollama or GPU needed.
    # Runs on Windows (the developed/tested platform) across supported Pythons.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"   # stream results instead of block-buffering
        run: python -u -m pytest -v --durations=15
